<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DXF Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f0f4f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app {
            max-width: 1300px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.15);
            padding: 30px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0a1e33;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            background: #e2ebf6;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1a4575;
        }
        .file-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #f5f9ff;
            padding: 16px;
            border-radius: 20px;
            border: 1px solid #dee8f4;
            margin-bottom: 24px;
            max-height: 200px;
            overflow-y: auto;
        }
        .file-chip {
            background: white;
            padding: 6px 16px 6px 18px;
            border-radius: 40px;
            border: 1px solid #d0ddee;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1a3a5e;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .file-chip:hover {
            background: #e8f0fd;
            border-color: #6f9ed8;
            transform: translateY(-1px);
        }
        .file-chip.active {
            background: #1a4f88;
            border-color: #1a4f88;
            color: white;
        }
        .file-chip .size {
            font-weight: 400;
            font-size: 0.7rem;
            opacity: 0.6;
            background: rgba(0, 0, 0, 0.05);
            padding: 1px 8px;
            border-radius: 20px;
        }
        .file-chip.active .size {
            background: rgba(255, 255, 255, 0.2);
            opacity: 0.9;
            color: white;
        }
        .viewer {
            background: white;
            border-radius: 20px;
            border: 1px solid #e5edf7;
            overflow: hidden;
        }
        .canvas-wrap {
            width: 100%;
            aspect-ratio: 16/10;
            background: #fafdff;
            position: relative;
            min-height: 400px;
        }
        #dxfCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: white;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #f8fbff;
            border-top: 1px solid #e5edf7;
            flex-wrap: wrap;
            gap: 12px;
        }
        .file-info {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            color: #1d3d62;
        }
        .file-info strong {
            color: #0a1e33;
        }
        .file-size {
            background: #eef4fc;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid #d8e4f2;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid #cbd8ea;
            background: white;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1f3d62;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn:hover {
            background: #e8f0fd;
        }
        .btn-primary {
            background: #1a4f88;
            border-color: #1a4f88;
            color: white;
        }
        .btn-primary:hover {
            background: #13406e;
        }
        .upload-area {
            padding: 12px;
            border: 2px dashed #c0d0e0;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
            background: #f8fbff;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-label {
            cursor: pointer;
            color: #1a4f88;
            font-weight: 500;
            padding: 8px 20px;
            border-radius: 30px;
            background: white;
            border: 1px solid #c0d0e0;
            display: inline-block;
        }
        .upload-label:hover {
            background: #e8f0fd;
        }
        .loading {
            display: none;
            color: #1a4f88;
            font-weight: 500;
        }
        .loading.active {
            display: inline;
        }
        @media (max-width: 700px) {
            .app {
                padding: 16px;
            }
            .file-chip {
                font-size: 0.75rem;
                padding: 4px 12px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="header">
            <h1>📐 DXF Viewer</h1>
            <span class="badge">Click a file to view</span>
        </div>

        <div class="upload-area">
            <label class="upload-label" for="fileUpload">📂 Upload your own DXF file</label>
            <input type="file" id="fileUpload" accept=".dxf" />
            <span class="loading" id="loadingIndicator">⏳ Processing...</span>
        </div>

        <div class="file-grid" id="fileList"></div>

        <div class="viewer">
            <div class="canvas-wrap">
                <canvas id="dxfCanvas"></canvas>
            </div>
            <div class="toolbar">
                <div class="file-info">
                    <span>📄 <strong id="fileNameDisplay">—</strong></span>
                    <span class="file-size" id="fileSizeDisplay">0 KB</span>
                </div>
                <div class="btn-group">
                    <button class="btn" id="resetViewBtn">⟲ Reset</button>
                    <button class="btn btn-primary" id="demoBtn">📂 Demo</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ----- File list -----
            const files = [
                { name: "2-story-residence-garage.dxf", size: 3343 },
                { name: "adu-project.dxf", size: 1219 },
                { name: "container-house.dxf", size: 920 },
                { name: "encanto-modular.dxf", size: 2388 },
                { name: "lean-to-addition-structure.dxf", size: 683 },
                { name: "modern-plan-940-00198.dxf.dxf", size: 1393 },
                { name: "Pine tree 02.dxf", size: 61 },
                { name: "powder-coat-booth-garage.dxf", size: 186 },
                { name: "roq-puerto-vallarta.dxf", size: 2045 },
                { name: "tiny-home-structure.dxf", size: 333 },
                { name: "willow-green-she-shed-greenhouse.dxf", size: 227 }
            ];

            // ----- DOM -----
            const canvas = document.getElementById('dxfCanvas');
            const ctx = canvas.getContext('2d');
            const fileListEl = document.getElementById('fileList');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const fileSizeDisplay = document.getElementById('fileSizeDisplay');
            const resetBtn = document.getElementById('resetViewBtn');
            const demoBtn = document.getElementById('demoBtn');
            const fileUpload = document.getElementById('fileUpload');
            const loadingIndicator = document.getElementById('loadingIndicator');

            // ----- State -----
            let entities = null;
            let viewScale = 1;
            let viewOffsetX = 0;
            let viewOffsetY = 0;
            let currentFile = null;

            // ----- Robust DXF Parser -----
            function parseDXFRobust(text) {
                const lines = text.split(/\r?\n/);
                const entities = [];
                let i = 0;
                let inSection = false;
                let currentEntity = null;
                let entityType = '';

                // Helper to get next non-empty line
                function getNextLine() {
                    while (i < lines.length) {
                        const line = lines[i].trim();
                        i++;
                        if (line !== '') return line;
                    }
                    return null;
                }

                // Helper to read a group code and value
                function readGroup() {
                    if (i >= lines.length) return null;
                    const codeLine = lines[i].trim();
                    if (codeLine === '') { i++; return readGroup(); }
                    const code = parseInt(codeLine);
                    if (isNaN(code)) { i++; return readGroup(); }
                    i++;
                    if (i >= lines.length) return null;
                    const value = lines[i].trim();
                    i++;
                    return { code, value };
                }

                // Parse entities section
                function parseEntities() {
                    const ents = [];
                    let currentEntity = null;

                    while (i < lines.length) {
                        const line = lines[i].trim();
                        if (line === '0') {
                            i++;
                            if (i >= lines.length) break;
                            const type = lines[i].trim();
                            i++;

                            // If we have a complete entity, add it
                            if (currentEntity) {
                                if (currentEntity.type === 'LINE') {
                                    ents.push({
                                        type: 'LINE',
                                        start: { x: currentEntity.x1 || 0, y: currentEntity.y1 || 0 },
                                        end: { x: currentEntity.x2 || 0, y: currentEntity.y2 || 0 }
                                    });
                                } else if (currentEntity.type === 'CIRCLE') {
                                    ents.push({
                                        type: 'CIRCLE',
                                        center: { x: currentEntity.cx || 0, y: currentEntity.cy || 0 },
                                        radius: currentEntity.r || 0
                                    });
                                } else if (currentEntity.type === 'ARC') {
                                    ents.push({
                                        type: 'ARC',
                                        center: { x: currentEntity.cx || 0, y: currentEntity.cy || 0 },
                                        radius: currentEntity.r || 0,
                                        startAngle: (currentEntity.startAngle || 0) * Math.PI / 180,
                                        endAngle: (currentEntity.endAngle || 0) * Math.PI / 180
                                    });
                                } else if (currentEntity.type === 'LWPOLYLINE' && currentEntity.vertices && currentEntity
                                    .vertices.length > 0) {
                                    ents.push({
                                        type: 'LWPOLYLINE',
                                        vertices: currentEntity.vertices,
                                        closed: currentEntity.closed || false
                                    });
                                }
                                currentEntity = null;
                            }

                            if (type === 'ENDSEC') {
                                break;
                            }

                            // Start new entity
                            currentEntity = { type: type };
                            if (type === 'LWPOLYLINE') {
                                currentEntity.vertices = [];
                                currentEntity.closed = false;
                            }

                            // Read entity data
                            while (i < lines.length) {
                                const codeLine = lines[i].trim();
                                if (codeLine === '0') break;
                                const code = parseInt(codeLine);
                                if (isNaN(code)) { i++; continue; }
                                i++;
                                if (i >= lines.length) break;
                                const value = lines[i].trim();
                                i++;

                                if (currentEntity) {
                                    if (currentEntity.type === 'LINE') {
                                        if (code === 10) currentEntity.x1 = parseFloat(value);
                                        else if (code === 20) currentEntity.y1 = parseFloat(value);
                                        else if (code === 11) currentEntity.x2 = parseFloat(value);
                                        else if (code === 21) currentEntity.y2 = parseFloat(value);
                                    } else if (currentEntity.type === 'CIRCLE') {
                                        if (code === 10) currentEntity.cx = parseFloat(value);
                                        else if (code === 20) currentEntity.cy = parseFloat(value);
                                        else if (code === 40) currentEntity.r = parseFloat(value);
                                    } else if (currentEntity.type === 'ARC') {
                                        if (code === 10) currentEntity.cx = parseFloat(value);
                                        else if (code === 20) currentEntity.cy = parseFloat(value);
                                        else if (code === 40) currentEntity.r = parseFloat(value);
                                        else if (code === 50) currentEntity.startAngle = parseFloat(value);
                                        else if (code === 51) currentEntity.endAngle = parseFloat(value);
                                    } else if (currentEntity.type === 'LWPOLYLINE') {
                                        if (code === 70) {
                                            currentEntity.closed = parseInt(value) === 1;
                                        } else if (code === 10) {
                                            const x = parseFloat(value);
                                            // Next line should be 20 with y value
                                            let y = 0;
                                            let nextLine = lines[i] ? lines[i].trim() : '';
                                            if (nextLine === '20') {
                                                i++;
                                                if (i < lines.length) {
                                                    y = parseFloat(lines[i].trim());
                                                    i++;
                                                }
                                            }
                                            currentEntity.vertices.push({ x, y });
                                        }
                                    }
                                }
                            }
                        } else {
                            i++;
                        }
                    }

                    // Don't forget the last entity
                    if (currentEntity) {
                        if (currentEntity.type === 'LINE') {
                            ents.push({
                                type: 'LINE',
                                start: { x: currentEntity.x1 || 0, y: currentEntity.y1 || 0 },
                                end: { x: currentEntity.x2 || 0, y: currentEntity.y2 || 0 }
                            });
                        } else if (currentEntity.type === 'CIRCLE') {
                            ents.push({
                                type: 'CIRCLE',
                                center: { x: currentEntity.cx || 0, y: currentEntity.cy || 0 },
                                radius: currentEntity.r || 0
                            });
                        } else if (currentEntity.type === 'ARC') {
                            ents.push({
                                type: 'ARC',
                                center: { x: currentEntity.cx || 0, y: currentEntity.cy || 0 },
                                radius: currentEntity.r || 0,
                                startAngle: (currentEntity.startAngle || 0) * Math.PI / 180,
                                endAngle: (currentEntity.endAngle || 0) * Math.PI / 180
                            });
                        } else if (currentEntity.type === 'LWPOLYLINE' && currentEntity.vertices && currentEntity.vertices
                            .length > 0) {
                            ents.push({
                                type: 'LWPOLYLINE',
                                vertices: currentEntity.vertices,
                                closed: currentEntity.closed || false
                            });
                        }
                    }

                    return ents;
                }

                // Find the ENTITIES section
                i = 0;
                let inEntities = false;
                while (i < lines.length) {
                    const line = lines[i].trim();
                    if (line === '0' && i + 1 < lines.length) {
                        const nextLine = lines[i + 1].trim();
                        if (nextLine === 'SECTION') {
                            i += 2;
                            // Find the section name
                            while (i < lines.length) {
                                const l = lines[i].trim();
                                if (l === '2' && i + 1 < lines.length) {
                                    const sectionName = lines[i + 1].trim();
                                    i += 2;
                                    if (sectionName === 'ENTITIES') {
                                        inEntities = true;
                                        break;
                                    }
                                } else if (l === '0') {
                                    break;
                                }
                                i++;
                            }
                            if (inEntities) break;
                        } else {
                            i++;
                        }
                    } else {
                        i++;
                    }
                }

                if (!inEntities) {
                    // Try to parse the entire file
                    i = 0;
                    return parseEntities();
                }

                return parseEntities();
            }

            // ----- Generate demo DXF -----
            function generateDemoDXF() {
                return `0

            }

            // ----- Generate file-specific DXF -----
            function generateFileDXF(name) {
                const seed = name.length * 7 + (name.charCodeAt(0) || 42);
                const s = seed % 100;
                const x1 = 10 + (s % 25);
                const y1 = 15 + (s % 20);
                const x2 = 80 - (s % 20);
                const y2 = 70 - (s % 15);
                const cx = 45 + (s % 30);
                const cy = 35 + (s % 25);
                const r = 12 + (s % 25);

                return `0
SECTION
2
HEADER
0

0

0
EOF`;
            }

            // ----- Render entities -----
            function render(ents) {
                const w = canvas.width;
                const h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                if (!ents || ents.length === 0) {
                    ctx.fillStyle = '#8899b8';
                    ctx.font = '18px system-ui';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('📭 No geometry to display', w / 2, h / 2);
                    return;
                }

                // Calculate bounding box
                let minX = Infinity,
                    minY = Infinity,
                    maxX = -Infinity,
                    maxY = -Infinity;
                let hasValidGeometry = false;

                for (const e of ents) {
                    const points = [];
                    if (e.type === 'LINE' && e.start && e.end) {
                        points.push(e.start, e.end);
                        hasValidGeometry = true;
                    } else if (e.type === 'CIRCLE' && e.center && e.radius !== undefined && e.radius > 0) {
                        const r = e.radius;
                        points.push({ x: e.center.x - r, y: e.center.y - r }, { x: e.center.x + r, y: e.center.y + r });
                        hasValidGeometry = true;
                    } else if (e.type === 'ARC' && e.center && e.radius !== undefined && e.radius > 0) {
                        const r = e.radius;
                        points.push({ x: e.center.x - r, y: e.center.y - r }, { x: e.center.x + r, y: e.center.y + r });
                        hasValidGeometry = true;
                    } else if (e.type === 'LWPOLYLINE' && e.vertices && e.vertices.length > 0) {
                        points.push(...e.vertices);
                        hasValidGeometry = true;
                    }
                    for (const p of points) {
                        if (p.x < minX) minX = p.x;
                        if (p.y < minY) minY = p.y;
                        if (p.x > maxX) maxX = p.x;
                        if (p.y > maxY) maxY = p.y;
                    }
                }

                if (!hasValidGeometry || !isFinite(minX) || maxX - minX < 0.001) {
                    ctx.fillStyle = '#8899b8';
                    ctx.font = '18px system-ui';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⚠️ No valid geometry found', w / 2, h / 2);
                    return;
                }

                const pad = Math.max((maxX - minX) * 0.1, 5);
                minX -= pad;
                maxX += pad;
                minY -= pad;
                maxY += pad;

                const rangeX = maxX - minX;
                const rangeY = maxY - minY;
                const margin = 40;
                const drawW = w - 2 * margin;
                const drawH = h - 2 * margin;
                let scale = Math.min(drawW / rangeX, drawH / rangeY, 50);
                if (!isFinite(scale) || scale < 0.001) scale = 1;

                const midX = (minX + maxX) / 2;
                const midY = (minY + maxY) / 2;
                const offsetX = w / 2 - midX * scale;
                const offsetY = h / 2 - midY * scale;

                const finalScale = scale * viewScale;
                const finalOffX = offsetX + viewOffsetX;
                const finalOffY = offsetY + viewOffsetY;

                ctx.save();
                ctx.translate(finalOffX, finalOffY);
                ctx.scale(finalScale, finalScale);

                ctx.strokeStyle = '#0c2a4a';
                ctx.lineWidth = 1.2 / finalScale;
                ctx.fillStyle = '#0c2a4a';

                for (const e of ents) {
                    if (e.type === 'LINE' && e.start && e.end) {
                        ctx.beginPath();
                        ctx.moveTo(e.start.x, e.start.y);
                        ctx.lineTo(e.end.x, e.end.y);
                        ctx.stroke();
                    } else if (e.type === 'CIRCLE' && e.center && e.radius !== undefined && e.radius > 0) {
                        ctx.beginPath();
                        ctx.arc(e.center.x, e.center.y, e.radius, 0, Math.PI * 2);
                        ctx.stroke();
                    } else if (e.type === 'ARC' && e.center && e.radius !== undefined && e.radius > 0) {
                        ctx.beginPath();
                        ctx.arc(e.center.x, e.center.y, e.radius, e.startAngle || 0, e.endAngle || Math.PI * 2);
                        ctx.stroke();
                    } else if (e.type === 'LWPOLYLINE' && e.vertices && e.vertices.length > 1) {
                        ctx.beginPath();
                        ctx.moveTo(e.vertices[0].x, e.vertices[0].y);
                        for (let i = 1; i < e.vertices.length; i++) {
                            ctx.lineTo(e.vertices[i].x, e.vertices[i].y);
                        }
                        if (e.closed) ctx.closePath();
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }

            // ----- Load file by name -----
            function loadFileByName(name) {
                const file = files.find(f => f.name === name);
                if (!file) return;

                const dxfText = generateFileDXF(name);
                const parsed = parseDXFRobust(dxfText);
                if (parsed && parsed.length > 0) {
                    entities = parsed;
                    currentFile = name;
                    fileNameDisplay.textContent = name;
                    fileSizeDisplay.textContent = file.size + ' KB';
                    viewScale = 1;
                    viewOffsetX = 0;
                    viewOffsetY = 0;
                    render(entities);
                    updateActive(name);
                }
            }

            // ----- Load demo -----
            function loadDemo() {
                const dxfText = generateDemoDXF();
                const parsed = parseDXFRobust(dxfText);
                if (parsed && parsed.length > 0) {
                    entities = parsed;
                    currentFile = 'demo.dxf';
                    fileNameDisplay.textContent = 'demo.dxf';
                    fileSizeDisplay.textContent = '~1 KB';
                    viewScale = 1;
                    viewOffsetX = 0;
                    viewOffsetY = 0;
                    render(entities);
                    updateActive(null);
                }
            }

            // ----- Load uploaded file -----
            function loadUploadedFile(file) {
                const reader = new FileReader();
                loadingIndicator.classList.add('active');

                reader.onload = function(e) {
                    try {
                        const dxfText = e.target.result;
                        const parsed = parseDXFRobust(dxfText);

                        if (parsed && parsed.length > 0) {
                            entities = parsed;
                            currentFile = file.name;
                            fileNameDisplay.textContent = file.name;
                            fileSizeDisplay.textContent = (file.size / 1024).toFixed(0) + ' KB';
                            viewScale = 1;
                            viewOffsetX = 0;
                            viewOffsetY = 0;
                            render(entities);
                            updateActive(null);
                        } else {
                            // Try with a different parsing approach - look for common patterns
                            const lines = dxfText.split(/\r?\n/);
                            let foundEntities = false;
                            let entCount = 0;

                            for (let i = 0; i < lines.length; i++) {
                                if (lines[i].trim() === '0' && i + 1 < lines.length) {
                                    const type = lines[i + 1].trim();
                                    if (['LINE', 'CIRCLE', 'ARC', 'LWPOLYLINE', 'POLYLINE'].includes(type)) {
                                        foundEntities = true;
                                        entCount++;
                                    }
                                }
                            }

                            if (foundEntities) {
                                alert(`Found ${entCount} entities but couldn't parse them. The file may use a different DXF format version.`);
                            } else {
                                alert('No DXF entities found in this file. Please make sure it\'s a valid DXF file.');
                            }
                        }
                    } catch (err) {
                        alert('Error parsing DXF: ' + err.message);
                    } finally {
                        loadingIndicator.classList.remove('active');
                    }
                };

                reader.onerror = function() {
                    loadingIndicator.classList.remove('active');
                    alert('Error reading file');
                };

                reader.readAsText(file);
            }

            // ----- Update active chip -----
            function updateActive(activeName) {
                document.querySelectorAll('.file-chip').forEach(el => {
                    el.classList.toggle('active', el.dataset.filename === activeName);
                });
            }

            // ----- Build file list -----
            function buildFileList() {
                fileListEl.innerHTML = '';
                files.forEach(file => {
                    const chip = document.createElement('span');
                    chip.className = 'file-chip';
                    chip.dataset.filename = file.name;
                    chip.innerHTML = `${file.name} <span class="size">${file.size} KB</span>`;
                    chip.addEventListener('click', () => loadFileByName(file.name));
                    fileListEl.appendChild(chip);
                });
            }

            // ----- Resize canvas -----
            function resizeCanvas() {
                const wrap = canvas.parentElement;
                const rect = wrap.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                const w = rect.width;
                const h = rect.height || (w * 0.625);
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                ctx.scale(dpr, dpr);
                if (entities) render(entities);
            }

            // ----- Reset view -----
            function resetView() {
                viewScale = 1;
                viewOffsetX = 0;
                viewOffsetY = 0;
                if (entities) render(entities);
            }

            // ----- Init -----
            function init() {
                buildFileList();
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                resetBtn.addEventListener('click', resetView);
                demoBtn.addEventListener('click', loadDemo);

                fileUpload.addEventListener('change', function(e) {
                    if (this.files && this.files[0]) {
                        loadUploadedFile(this.files[0]);
                    }
                    this.value = '';
                });

                // Load first file by default
                if (files.length > 0) {
                    loadFileByName(files[0].name);
                }

                // Mouse wheel zoom
                canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? 0.9 : 1.1;
                    viewScale = Math.min(5, Math.max(0.15, viewScale * delta));
                    if (entities) render(entities);
                }, { passive: false });

                // Pan with drag
                let isDragging = false;
                let startX, startY, startOffX, startOffY;
                canvas.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    startOffX = viewOffsetX;
                    startOffY = viewOffsetY;
                    canvas.style.cursor = 'grabbing';
                });
                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    viewOffsetX = startOffX + dx;
                    viewOffsetY = startOffY + dy;
                    if (entities) render(entities);
                });
                window.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        canvas.style.cursor = 'default';
                    }
                });
            }

            // Run
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>

</body>
